name: quick-review
description: Fast PR review pipeline — review, fix issues raised, then update the PR description.

steps:
  - skill: adk-review-pr
    args: "${PR_URL}"
    description: Review the PR with severity-ordered findings.

  - skill: adk-review-feedback
    args: "${PR_URL}"
    description: Apply the fixes for the findings raised in the review.
    condition: "review-has-findings"

  - skill: adk-publish-github
    args: "${PR_URL} --mode update-pr"
    description: Generate or update the PR description on GitHub.
