name: quick-review
description: Fast code review pipeline — review, fix issues, finalize

steps:
  - skill: adk-review-pr
    args: "${PR_URL}"
    description: Review the PR with multi-perspective analysis

  - skill: adk-address-review-feedback
    args: "${PR_URL}"
    description: Fix any issues found during review
    condition: "review-has-findings"

  - skill: adk-commit
    args: "${PR_URL} --mode pr"
    description: Generate or update the PR description
