name: doc-update
description: Documentation refresh — review existing docs, update them, then optionally refresh adjacent docs.

steps:
  - skill: adk-docs-review
    args: "${DOC_PATH}"
    description: Review existing documentation for quality and accuracy.

  - skill: adk-docs-write
    args: "${DOC_PATH} --action update"
    description: Apply improvements based on the review findings.

  - skill: adk-docs-write
    args: "${DOC_PATH} --action improve --scope docs --auto"
    description: Refresh surrounding repo docs when the change has broader impact.
    condition: "complexity >= medium"
