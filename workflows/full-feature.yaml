name: full-feature
description: End-to-end feature implementation from brainstorming through implementation, review, and docs

steps:
  - skill: adk-brainstorm
    args: "${TASK} --skill-context plan --artifact plan"
    description: Settle direction, blast radius, and artifact routing before execution

  - skill: adk-spec
    args: "${TASK} --type technical"
    description: Capture the selected direction in a technical spec when needed
    condition: "complexity >= medium"

  - skill: adk-plan
    args: "${TASK}"
    description: Create implementation plan with file list and sequencing

  - skill: adk-build
    args: "${TASK}"
    description: Implement the feature following the approved plan

  - skill: adk-review-local-changes
    args: "--focus correctness --auto"
    description: Self-review the implementation before PR
    condition: "has-tests"

  - skill: adk-write-docs
    args: "${TASK} --type changelog --auto"
    description: Update changelog with the new feature
