name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bump input
        run: |
          case "${{ inputs.bump }}" in
            patch|minor|major) ;;
            *) echo "Unsupported bump: ${{ inputs.bump }}"; exit 1 ;;
          esac

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump all versioned artifacts
        id: bump
        run: |
          npm run version:bump -- "${{ inputs.bump }}"
          npm run validate

          NEW_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git add package.json package-lock.json .claude-plugin/marketplace.json plugins docs/reference

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 1
          fi

          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD --follow-tags
