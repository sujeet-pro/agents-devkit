name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills, agents & content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec-level checks (frontmatter keys, name match, body size, etc.)
      - name: Validate (spec)
        run: npm run validate

      # Stricter content checks (markdown well-formedness, link integrity,
      # containment: nothing escapes its skill folder).
      - name: Validate (content, verbose)
        run: npm run validate:content:verbose

      # Make sure the installer's dry-run still produces a coherent plan
      # against a fresh checkout — catches regressions in cli/lib/* before
      # we ever publish.
      - name: Installer dry-run (global)
        run: node cli/index.mjs --mode global --dry-run -y
