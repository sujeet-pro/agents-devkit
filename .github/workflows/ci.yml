name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills, agents, hooks, MCP, and canonical sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec-level checks (frontmatter keys, name match, body size, etc.)
      # Also re-emits skills-manifest.json from the live tree.
      - name: Validate (spec)
        run: npm run validate

      # Confirm bin/canonical/* has been propagated into every skill's
      # references/interaction-contract.md byte-identically.
      - name: Validate (canonical sync)
        run: npm run validate:sync
