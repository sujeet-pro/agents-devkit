name: Publish to npm

# Manual release pipeline.
#
# Trusted publishing (OIDC) is enabled for this repo on npm, so no
# NPM_TOKEN secret is required — the npm registry verifies the GitHub
# Actions OIDC token issued for this exact workflow + environment.
# See https://docs.npmjs.com/trusted-publishers
#
# Setup (one-time, on npmjs.com):
#   1. Publish v0.0.1 manually once with `npm publish` (so the package
#      exists on the registry and you can configure trusted publishing).
#   2. On https://www.npmjs.com/package/agents-devkit/access, add a
#      trusted publisher with:
#         repository: <your-org>/agents-devkit
#         workflow:   .github/workflows/publish.yml
#         environment: npm-publish     (matches the `environment:` below)
#   3. From then on, this workflow can publish without any secret.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: "Dry run (skip publish + push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write          # to push the version commit + tag back
  id-token: write          # required for npm OIDC trusted publishing

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish     # match this in the npm trusted-publisher config
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Pre-publish gates ──
      - name: Validate (spec)
        run: npm run validate

      - name: Validate (content, verbose)
        run: npm run validate:content:verbose

      - name: Installer dry-run
        run: node cli/index.mjs --mode global --dry-run -y

      # ── Bump version locally; do not commit yet so a failed publish
      # leaves the working tree clean for re-runs. ──
      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (${{ inputs.bump }})
        id: bump
        run: |
          NEW=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW"        >> "$GITHUB_OUTPUT"

      # Re-validate after the version bump so the manifest written on the
      # consumer's machine matches the version we publish.
      - name: Re-validate after bump
        run: npm run validate:all

      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        run: npm publish --provenance --access public --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public

      - name: Commit + push version + tag
        if: ${{ !inputs.dry-run }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD --follow-tags
