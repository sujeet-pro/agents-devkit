# code_index — shared library defaults.
#
# Override these by creating ~/.agents-devkit/config/code-index.yaml with
# the same shape; values are deep-merged (user overrides win key-by-key).
# Per-invocation CLI flags / Python-API kwargs win over both.

embed:
  # Model used by default (no --detailed). Fast, decent quality.
  default_model: nomic-embed-text
  # Higher-quality alternative; ~4-5x slower.
  detailed_model: bge-m3
  # Parallel /api/embed requests against ollama. Should match or be <=
  # OLLAMA_NUM_PARALLEL on the daemon.
  workers: 8
  # Hard cap per chunk; the chunker splits at the next AST boundary if
  # a leaf would exceed this.
  max_tokens_per_chunk: 1500

retrieval:
  # Hybrid = weighted merge of dense vector + BM25 (LanceDB FTS).
  hybrid: true
  vector_weight: 0.6
  fts_weight: 0.4
  top_k_dense: 50
  top_k_fts: 50
  top_k_merged: 80
  top_k_final: 10

chunker:
  # 'tree-sitter' = AST-aware boundaries via tree-sitter-language-pack.
  # 'heuristic' = the previous regex-based chunker (used as fallback).
  method: tree-sitter
  fallback: heuristic
  max_tokens: 1500
  min_tokens: 50

base_index:
  # How long the repo-level base index may go without a refresh before
  # consumers warn or refuse to use it. Per-call override available via
  # `open_index(..., max_staleness_days=…)`.
  max_staleness_days: 7
