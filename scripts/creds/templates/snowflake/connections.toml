# Snowflake connections.toml — GENERATED by scripts/creds/init.py from env vars.
# Do not hand-edit; change the values in ~/.zshenv and re-run init.py instead.
# The PAT itself is NOT stored here — the .mcp.json launcher passes it via the
# --password flag (SNOWFLAKE_ACCESS_TOKEN). validate.py only reads `account`.

# authenticator = "snowflake" (default): the PAT is accepted in the password
# field. NOTE: "PROGRAMMATIC_ACCESS_TOKEN" would require the PAT in `token=`,
# but the .mcp.json launcher passes it via --password, so default auth is used.
[${SNOWFLAKE_CONNECTION_NAME}]
account = "${SNOWFLAKE_ACCOUNT}"
user = "${SNOWFLAKE_USER}"
authenticator = "${SNOWFLAKE_AUTHENTICATOR}"
role = "${SNOWFLAKE_ROLE}"
warehouse = "${SNOWFLAKE_WAREHOUSE}"
database = "${SNOWFLAKE_DATABASE}"
schema = "${SNOWFLAKE_SCHEMA}"
