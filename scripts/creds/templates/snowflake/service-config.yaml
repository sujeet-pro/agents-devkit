# Snowflake MCP (snowflake-labs-mcp) service config — GENERATED by
# scripts/creds/init.py (SNOWFLAKE_SERVICE_CONFIG_FILE). No secrets here.
#
# sql_statement_permissions gates which statement types the MCP may run.
# Defaults below are READ-ONLY: inspection + SELECT allowed, all mutations
# denied. `All: false` is the catch-all for any type not listed above.

sql_statement_permissions:
  - Select: true
  - Describe: true
  - Show: true
  - Use: true
  - Explain: true
  - With: true
  - Insert: false
  - Update: false
  - Delete: false
  - Merge: false
  - Create: false
  - Drop: false
  - Alter: false
  - Truncate: false
  - Command: false
  - All: false

# other_services gates the non-Cortex tool groups. These default to FALSE,
# so WITHOUT this block the server registers ZERO tools (it still connects).
# query_manager  -> run-SQL tool (already constrained by sql_statement_permissions above)
# object_manager -> DESCRIBE/SHOW/create-drop object tools (mutations still gated by perms)
# semantic_manager -> semantic-view tools
other_services:
  object_manager: true
  query_manager: true
  semantic_manager: false

# No Cortex agent / search / analyst services wired up by default.
agent_services: []
search_services: []
analyst_services: []
